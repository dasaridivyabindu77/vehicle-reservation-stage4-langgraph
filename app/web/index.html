<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CityPark Assistant</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --me:#2563eb; --bot:#334155; --txt:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 18px; background:var(--panel); font-weight:600; font-size:18px;
             border-bottom:1px solid #000; display:flex; justify-content:space-between; align-items:center; }
    header .meta { font-size:12px; color:var(--muted); font-weight:400; }
    #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:75%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; }
    .me  { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
    .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
    .src { font-size:11px; color:var(--muted); margin-top:4px; }
    form { display:flex; gap:8px; padding:14px; background:var(--panel); border-top:1px solid #000; }
    input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #475569;
            background:#0b1220; color:var(--txt); font-size:15px; }
    button { padding:12px 20px; border:0; border-radius:10px; background:var(--me); color:#fff;
             font-size:15px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
  </style>
</head>
<body>
  <header>
    <span>🅿️ CityPark Assistant</span>
    <span class="meta" id="meta">connecting…</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask about hours, prices, availability — or say 'book a space'…" />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const meta = document.getElementById('meta');
    const sessionId = 'web-' + Math.random().toString(36).slice(2, 10);

    function bubble(text, who, sources) {
      const el = document.createElement('div');
      el.className = 'msg ' + who;
      el.textContent = text;
      if (sources && sources.length) {
        const s = document.createElement('div');
        s.className = 'src';
        s.textContent = 'sources: ' + sources.map(x => x.doc_id).join(', ');
        el.appendChild(s);
      }
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    async function health() {
      try {
        const r = await fetch('/health');
        const j = await r.json();
        meta.textContent = `vector: ${j.vector_backend} · llm: ${j.llm}`;
      } catch { meta.textContent = ''; }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      bubble(text, 'me');
      input.value = '';
      send.disabled = true;
      try {
        const r = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId })
        });
        const j = await r.json();
        bubble(j.reply, 'bot', j.sources);
      } catch (err) {
        bubble('Sorry, something went wrong reaching the server.', 'bot');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    health();
    bubble("Hi! I'm the CityPark assistant. Ask me about opening hours, prices, availability, location — or say \"I'd like to book a space\".", 'bot');
  </script>
</body>
</html>
