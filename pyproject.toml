[project]
name = "vehicle-reservation-rag-chatbot"
version = "1.0.0"
description = "Retrieval-augmented vehicle parking assistant"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "chromadb>=1.0,<2",
  "numpy>=2.2,<3",
  "pytest>=8.4,<9",
  "langchain-core>=0.3,<1",
  "langgraph>=0.2,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
