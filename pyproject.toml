[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citypark-chatbot"
version = "0.1.0"
description = "RAG chatbot for parking-space information and reservations (Stage 1)"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
packages = ["app", "app.data", "app.web", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
